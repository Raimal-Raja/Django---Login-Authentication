{% block title %}Sign Up - SecureAuth{% endblock %}

{% block content %}
<div class="signup-container">
    <h2>Sign Up</h2>
    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="alert {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}
    <form method="post" action="{% url 'register' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required>
        </div>
        <div class="form-group">
            <label for="id_first_name">First Name</label>
            <input type="text" name="first_name" id="id_first_name" required>
        </div>
        <div class="form-group">
            <label for="id_last_name">Last Name</label>
            <input type="text" name="last_name" id="id_last_name" required>
        </div>
        <div class="form-group">
            <label for="id_email">Email</label>
            <input type="email" name="email" id="id_email" required>
        </div>
        <div class="form-group">
            <label for="id_phone_number">Phone Number</label>
            <input type="tel" name="phone_number" id="id_phone_number">
        </div>
        <div class="form-group">
            <label for="id_bio">Bio</label>
            <textarea name="bio" id="id_bio"></textarea>
        </div>
        <div class="form-group">
            <label for="id_location">Location</label>
            <input type="text" name="location" id="id_location">
        </div>
        <div class="form-group">
            <label for="id_password1">Password</label>
            <input type="password" name="password1" id="id_password1" required>
        </div>
        <div class="form-group">
            <label for="id_password2">Confirm Password</label>
            <input type="password" name="password2" id="id_password2" required>
        </div>
        <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
</div>

<style>
    .signup-container {
        max-width: 400px;
        margin: 2rem auto;
        padding: 2rem;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h2 {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #1F2937;
    }
    .form-group {
        margin-bottom: 1.5rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #1F2937;
    }
    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 0.85rem;
        border: 2px solid #E5E7EB;
        border-radius: 8px;
        font-size: 1rem;
    }
    .btn-primary {
        width: 100%;
        padding: 0.85rem;
        background: linear-gradient(135deg, #4F46E5, #7C3AED);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .alert {
        padding: 1rem;
        margin-bottom: 1rem;
        border-radius: 8px;
        color: #fff;
    }
    .alert.error {
        background: #EF4444;
    }
    .alert.success {
        background: #10B981;
    }
</style>
{% endblock %}

{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-container animate__animated animate__fadeIn">
    <div class="auth-card">
        <div class="auth-left">
            <div class="auth-logo">
                <img src="{% static 'images/logo.png' %}" alt="Logo">
            </div>
            <h2 class="auth-title">Welcome Back!</h2>
            <p class="auth-subtitle">Please login to your account</p>
            
            <form method="post" class="auth-form">
                {% csrf_token %}
                <div class="form-group">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        {{ form.username }}
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        {{ form.password }}
                    </div>
                </div>
                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <button type="submit" class="btn auth-btn">Login</button>
                <div class="auth-links">
                    <a href="#" class="forgot-password">Forgot Password?</a>
                    <a href="{% url 'myapp:signup' %}" class="register-link">Don't have an account? Register</a>
                </div>
            </form>
        </div>
        <div class="auth-right">
            <div class="auth-illustration">
                <img src="{% static 'images/login-illustration.svg' %}" alt="Login Illustration" class="illustration-img">
            </div>
        </div>
    </div>
</div>
{% endblock %}
